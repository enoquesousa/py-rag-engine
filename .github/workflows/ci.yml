name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          pip-version: "26.2"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/api-ci.txt
      - name: Install dependencies
        run: |
          python -m pip install "setuptools==84.1.0"
          python -m pip install -c constraints/api-ci.txt -e ".[api]" pytest httpx
          python -m pip check
      - name: Run tests
        run: env -u TEST_POSTGRES_URL -u LM_STUDIO_BASE_URL python -m pytest -q
      - name: Audit installed API and test dependencies
        run: |
          python -m pip list --format=freeze --exclude py-rag-engine > "$RUNNER_TEMP/api-installed.txt"
          python -m venv "$RUNNER_TEMP/audit-venv"
          "$RUNNER_TEMP/audit-venv/bin/python" -m pip install "pip==26.2" "pip-audit==2.10.1" "build==1.6.1"
          "$RUNNER_TEMP/audit-venv/bin/python" -m pip_audit -r "$RUNNER_TEMP/api-installed.txt" --no-deps --disable-pip --strict --progress-spinner off
      - name: Build package
        run: '"$RUNNER_TEMP/audit-venv/bin/python" -m build --outdir "$RUNNER_TEMP/dist"'
